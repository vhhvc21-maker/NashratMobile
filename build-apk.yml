name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NashratMobileAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q NashratMobileAndroid.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: NashratMobileAndroid
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NashratMobile-APK
          path: NashratMobileAndroid/app/build/outputs/apk/debug/app-debug.apk
